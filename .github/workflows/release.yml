# Canonical release workflow. Vendored into each repo by scripts/ci-template/vendor-ci.sh —
# edit THIS file and re-run the vendor script; never edit a repo's copy directly.
#
# Tagging v<version> builds the project, packages it, signs it and publishes it to this repo's
# own release, then asks kgsm-meta to fold it into the fleet's pacman repository.
name: release

on:
  push:
    tags: ['v*', 'models-v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: read

env:
  SIGN_KEY: B7624435FAC1A8280B280CFBA6FBDB3B724DED1B

jobs:
  build:
    # This repo also publishes a package on its own tag prefix — see the job at the end. That tag
    # does not start with `v`, so this one condition keeps the main pair off it, and `package`
    # skips with it because it needs this job.
    if: github.ref_type != 'tag' || startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The tag IS the version. A mismatch is a mistake in one of the two places, and shipping
      # either way would publish a package whose name disagrees with what it contains.
      - name: Verify the tag matches the declared version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          declared="$(./deploy/version.sh)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$declared" ]; then
            echo "::error::tag v${tag} but deploy/version.sh declares ${declared}"
            exit 1
          fi
          echo "version ${declared}"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Every TheKrystalShip.* dependency comes from the org's GitHub Packages feed. A token is
      # required even though the packages are public — an uncredentialed restore is a flat 401 —
      # but any token works, so the automatic one does. It is written into the checkout's own
      # nuget.config, which exists only for this run.
      - name: Authenticate the package feed
        run: |
          dotnet nuget update source github \
            --username ci \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text \
            --configfile nuget.config


      # Hermetic: the tests touch no model, no card and no socket, so the runner needs none of the
      # 813MB this leaf loads at runtime.
      - name: Test
        run: dotnet test kgsm-speech.slnx -c Release --nologo

      # Framework-dependent single-file — a node carries the .NET runtime, so it is not bundled.
      - name: Publish
        run: |
          dotnet publish src/Daemon/kgsm-speech.csproj -c Release -r linux-x64 -o artifacts/publish
          # KokoroSharp copies its voice files to the BUILD output and its targets have no publish
          # step; the csproj carries them over. A publish tree without them yields a daemon that
          # loads kokoro and then has no voice to speak in — silent until somebody asks it to talk.
          test -d artifacts/publish/voices

      - uses: actions/upload-artifact@v7
        with:
          name: stage
          path: artifacts/publish
          include-hidden-files: true
          retention-days: 1
  package:
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      # The container has neither git nor node, and every JavaScript action needs node present in
      # the container it runs in — so this plain shell step has to come before any `uses:`.
      - name: Provision the container
        run: pacman -Sy --noconfirm --needed git nodejs rsync gnupg github-cli

      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: stage
          path: artifacts/publish
      # makepkg refuses to run as root, and root-owned sources are unreadable to the build user.
      - name: Create the build user
        run: |
          useradd -m builder
          chown -R builder:builder .

      - name: Import the packaging key
        env:
          KEY: ${{ secrets.KGSM_PACKAGING_KEY }}
        run: |
          printf '%s' "$KEY" | runuser -u builder -- gpg --batch --import
          # Trust it ultimately in the builder's own keyring: makepkg signs with it, and gpg
          # refuses to sign with a key it has no trust path to.
          runuser -u builder -- bash -c \
            "printf '%s:6:\n' '$SIGN_KEY' | gpg --batch --import-ownertrust"

      # --nodeps because build() only asserts the publish output exists — nothing compiles here, no
      # PKGBUILD declares makedepends, and the packages depending on `kgsm` could never be built in
      # a container that has no kgsm installed.
      - name: Package and sign
        run: |
          runuser -u builder -- bash -lc \
            'cd packaging && makepkg --sign --key '"$SIGN_KEY"' --nodeps -f --noconfirm'

      - name: Verify the signature before publishing anything
        run: |
          cd packaging
          for p in *.pkg.tar.zst; do
            runuser -u builder -- gpg --verify "${p}.sig" "$p"
            echo "signed: $p"
          done

      - name: Publish to this repo's release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                 --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            packaging/*.pkg.tar.zst packaging/*.pkg.tar.zst.sig

      # The fleet's repository is one aggregation point, and this tells it there is something new to
      # collect. Best-effort on purpose: a cross-repo dispatch cannot use this workflow's own
      # GITHUB_TOKEN, so it needs an organisation secret, and where that is absent kgsm-meta's
      # schedule picks the release up within fifteen minutes instead. A secret cannot be tested in
      # an `if:`, so the check is in the script and a missing token is a message, not a failure.
      - name: Ask kgsm-meta to aggregate
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        env:
          DISPATCH_TOKEN: ${{ secrets.KGSM_META_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "no KGSM_META_DISPATCH_TOKEN — the fleet repository aggregates on its own schedule"
            exit 0
          fi
          printf '{"event_type":"package-released","client_payload":{"repo":"%s","tag":"%s"}}' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" \
            | GH_TOKEN="$DISPATCH_TOKEN" gh api --method POST \
                /repos/TheKrystalShip/kgsm-meta/dispatches --input -

      # A dispatch run proves the package builds without publishing one.
      - name: Keep the package as a run artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: packaging/*.pkg.tar.zst*

  package-models:
    # Its own tag, because its version is not this repo's release line. The main build/package pair
    # skips this tag on the `v`-prefix condition above, and this job skips every other one.
    if: startsWith(github.ref_name, 'models-v')
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Provision the container
        run: pacman -Sy --noconfirm --needed git nodejs rsync gnupg github-cli

      - uses: actions/checkout@v7

      # packaging/models/PKGBUILD declares its pkgver literally and reads no deploy/version.sh, so the
      # assertion is against that literal. A mismatch would publish a package whose name disagrees
      # with what it contains.
      - name: Verify the tag matches the declared version
        run: |
          declared="$(sed -n 's/^pkgver=//p' packaging/models/PKGBUILD | head -1)"
          tag="${GITHUB_REF_NAME#models-v}"
          if [ "$tag" != "$declared" ]; then
            echo "::error::tag models-v${tag} but packaging/models/PKGBUILD declares ${declared}"
            exit 1
          fi
          echo "version ${declared}"

      # makepkg refuses to run as root, and root-owned sources are unreadable to the build user.
      - name: Create the build user
        run: |
          useradd -m builder
          chown -R builder:builder .

      - name: Import the packaging key
        env:
          KEY: ${{ secrets.KGSM_PACKAGING_KEY }}
        run: |
          printf '%s' "$KEY" | runuser -u builder -- gpg --batch --import
          runuser -u builder -- bash -c \
            "printf '%s:6:\n' '$SIGN_KEY' | gpg --batch --import-ownertrust"

      - name: Package and sign
        run: |
          runuser -u builder -- bash -lc \
            'cd packaging/models && makepkg --sign --key '"$SIGN_KEY"' --nodeps -f --noconfirm'

      - name: Verify the signature before publishing anything
        run: |
          cd packaging/models
          for p in *.pkg.tar.zst; do
            runuser -u builder -- gpg --verify "${p}.sig" "$p"
            echo "signed: $p"
          done

      - name: Publish to this repo's release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                 --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            packaging/models/*.pkg.tar.zst packaging/models/*.pkg.tar.zst.sig

      # Same as the main job's: tell the fleet's repository there is something new to collect, and
      # fall back on its schedule where the organisation secret is absent.
      - name: Ask kgsm-meta to aggregate
        continue-on-error: true
        env:
          DISPATCH_TOKEN: ${{ secrets.KGSM_META_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "no KGSM_META_DISPATCH_TOKEN — the fleet repository aggregates on its own schedule"
            exit 0
          fi
          printf '{"event_type":"package-released","client_payload":{"repo":"%s","tag":"%s"}}' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" \
            | GH_TOKEN="$DISPATCH_TOKEN" gh api --method POST \
                /repos/TheKrystalShip/kgsm-meta/dispatches --input -
